name: Publicar Ambro Studio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Confirmar versão da tag
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "A tag deve ser v$packageVersion"
          }

      - name: Testar e validar
        run: pnpm test

      - name: Validar estilo
        run: pnpm lint

      - name: Gerar instalador e atualização
        run: pnpm desktop:build

      - name: Publicar release completa
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tag = $env:GITHUB_REF_NAME
          $installer = "release/Ambro-Studio-Setup-$packageVersion.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release/latest.yml"

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --verify-tag --title "Ambro Studio $packageVersion" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag $installer $blockmap $metadata --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
